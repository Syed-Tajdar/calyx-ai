services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: callloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callloom_dev}
      POSTGRES_DB: callloom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callloom"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    restart: "no"
    image: migrate/migrate:v4.17.1
    volumes:
      - ../db/postgres/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://callloom:${POSTGRES_PASSWORD:-callloom_dev}@postgres:5432/callloom?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      # Evict only keys with TTL (dedup hashes), nearest-expiry first.
      # Do NOT use allkeys-lru (could drop live dedup â†’ needless republish)
      # or noeviction (writes fail at ceiling â†’ duplicate balloon).
      - --maxmemory-policy
      - volatile-ttl
      - --requirepass
      - ${REDIS_PASSWORD:-redis_dev}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    restart: unless-stopped
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      # rpk can exceed 5s under load; false "unhealthy" fails verify-system Docker 15/15.
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 20s

  kafka-init:
    restart: "no"
    image: redpandadata/redpanda:v24.2.4
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk topic create callloom.pings.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.pings.v1.dlq --brokers redpanda:9092 --partitions 3 --replicas 1 -c cleanup.policy=delete -c retention.ms=2592000000 || true
        rpk topic create callloom.calls.call_recording_ready.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.calls.call_transcript_ready.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.calls.call_scored.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.scoring.dlq.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.enrichment.dlq.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.compliance.risk_scored.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.compliance.violation_detected.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.compliance.dlq.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.conversions.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.attribution.attributed.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.attribution.dlq.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
    depends_on:
      redpanda:
        condition: service_healthy

  clickhouse-init:
    restart: "no"
    image: clickhouse/clickhouse-server:24.8
    volumes:
      - ../db/clickhouse/migrations/000002_phase2_analytics.up.sql:/init-phase2.sql:ro
      - ../db/clickhouse/migrations/000003_phase3_compliance.up.sql:/init-phase3.sql:ro
      - ../db/clickhouse/migrations/000004_phase3_ask_ai.up.sql:/init-phase4.sql:ro
      - ../db/clickhouse/migrations/000005_phase3_attribution.up.sql:/init-phase5.sql:ro
      - ../db/clickhouse/migrations/000006_demo_fixture.up.sql:/init-phase6.sql:ro
      - ../db/clickhouse/migrations/000007_pings_call_key.up.sql:/init-phase7.sql:ro
      - ../db/clickhouse/migrations/000008_pings_occurred_at.up.sql:/init-phase8.sql:ro
      - ../db/clickhouse/migrations/000009_pings_platform_duplicate.up.sql:/init-phase9.sql:ro
      - ../db/clickhouse/migrations/000010_enrichment_attrs_replacing.up.sql:/init-phase10.sql:ro
      - ../db/clickhouse/migrations/000011_pings_ringba_parity_b1.up.sql:/init-phase11.sql:ro
      - ../db/clickhouse/migrations/000012_pings_has_converted.up.sql:/init-phase12.sql:ro
      - ../db/clickhouse/migrations/000013_pings_phase2a_call_flags.up.sql:/init-phase13.sql:ro
      - ../db/clickhouse/migrations/000014_pings_required_duration.up.sql:/init-phase14.sql:ro
      - ../db/clickhouse/migrations/000015_pings_was_payout_adjusted.up.sql:/init-phase15.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --query "SELECT 1"; do sleep 2; done
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase2.sql || true
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase3.sql || true
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase4.sql || true
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase5.sql || true
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase6.sql || true
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase7.sql || true
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase8.sql || true
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase9.sql || true
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase10.sql || true
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase11.sql || true
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase12.sql || true
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase13.sql || true
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase14.sql || true
        clickhouse-client --host clickhouse --password ${CLICKHOUSE_PASSWORD:-callloom_dev} --multiquery < /init-phase15.sql || true
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    restart: unless-stopped
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-callloom_dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
      # Host 9100 — avoid reserved 9000 on shared servers (container still listens on 9000).
      - "127.0.0.1:9100:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../db/clickhouse/migrations/000001_pings_table.up.sql:/docker-entrypoint-initdb.d/001_pings.sql:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      INGESTION_PORT: "8080"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_PINGS: callloom.pings.v1
      DEDUP_TTL_HOURS: "240"
      DATABASE_URL: postgres://callloom_ingestion:${POSTGRES_INGESTION_PASSWORD:-ingestion_dev}@postgres:5432/callloom?sslmode=disable
      ANI_ENCRYPTION_KEY: ${ANI_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      MOCK_MODE: ${MOCK_MODE:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  consumer:
    restart: unless-stopped
    build:
      context: ../services/consumer
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      APP_ENV: ${APP_ENV:-development}
      CONSUMER_PORT: "8081"
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_PINGS: callloom.pings.v1
      KAFKA_TOPIC_PINGS_DLQ: callloom.pings.v1.dlq
      KAFKA_CONSUMER_GROUP: callloom-consumer
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-callloom_dev}
      BATCH_SIZE: "500"
      BATCH_FLUSH_MS: "5000"
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    # Process exits when the live Kafka consumer stays non-member (see resilient-consumer).
    restart: unless-stopped
    ports:
      # Host 3100 — avoid reserved 3000–3003 on shared servers.
      - "127.0.0.1:3100:3000"
    environment:
      API_PORT: "3000"
      # KafkaJS reconnect DNS storms otherwise starve getaddrinfo for PG/CH readiness.
      UV_THREADPOOL_SIZE: "64"
      DATABASE_URL: postgres://callloom_api:${POSTGRES_API_PASSWORD:-api_dev}@postgres:5432/callloom?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-callloom_dev_jwt_secret_min_32_chars_long}
      CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD:-callloom_dev}@clickhouse:8123
      CLICKHOUSE_DB: default
      MOCK_MODE: ${MOCK_MODE:-true}
      DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED:-true}
      # Off = no fake /live UUIDs; Kafka consumer feeds real integration pings to WS.
      MOCK_EMITTER_ENABLED: "false"
      SINGLE_TENANT_MODE: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      PROVIDERCONFIG_URL: http://providerconfig:8084
      ASK_AI_URL: http://ask-ai:8086
      PROVIDER_CATALOG_PATH: /app/catalog.json
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_PINGS: callloom.pings.v1
      KAFKA_TOPIC_CALL_SCORED: callloom.calls.call_scored.v1
      KAFKA_TOPIC_ATTRIBUTION_ATTRIBUTED: callloom.attribution.attributed.v1
      KAFKA_TOPIC_COMPLIANCE_VIOLATION: callloom.compliance.violation_detected.v1
      KAFKA_TOPIC_CALL_TRANSCRIPT_READY: callloom.calls.call_transcript_ready.v1
      DEEPGRAM_CALLBACK_SECRET: ${DEEPGRAM_CALLBACK_SECRET:-dev_deepgram_callback_secret_change_me}
      ADSPEND_SOURCE: mock
      NOTIFICATION_CHANNEL: mock
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      PLATFORM_SYNC_URL: http://platform-sync:8088
      WRITEBACK_ENABLED: ${WRITEBACK_ENABLED:-false}
      WRITEBACK_INTERNAL_TOKEN: ${WRITEBACK_INTERNAL_TOKEN:-dev_writeback_internal_token_change_me}
      # v2 Phase 2A — Ask AI on numbers. Off unless FEATURE_ASK_AI=true.
      FEATURE_ASK_AI: ${FEATURE_ASK_AI:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      ASK_AI_TOKEN_BUDGET_DAILY: ${ASK_AI_TOKEN_BUDGET_DAILY:-300000}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callloom_dev}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:-api_dev}
      POSTGRES_INGESTION_PASSWORD: ${POSTGRES_INGESTION_PASSWORD:-ingestion_dev}
      POSTGRES_SYNC_PASSWORD: ${POSTGRES_SYNC_PASSWORD:-sync_dev}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-callloom_dev}
      ANI_ENCRYPTION_KEY: ${ANI_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev}
      APP_ENV: ${APP_ENV:-development}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3101,http://127.0.0.1:3101}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      providerconfig:
        condition: service_started
        required: false
      platform-sync:
        condition: service_started
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  providerconfig:
    profiles: ["intelligence"]
    build:
      context: ..
      dockerfile: services/providerconfig/Dockerfile
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      PROVIDERCONFIG_PORT: "8084"
      MOCK_MODE: "true"
      SINGLE_TENANT_MODE: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      DATABASE_URL: postgres://callloom_api:${POSTGRES_API_PASSWORD:-api_dev}@postgres:5432/callloom?sslmode=disable
      PROVIDER_CATALOG_PATH: /app/catalog.json
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  compliance-intelligence:
    profiles: ["intelligence"]
    build:
      context: ..
      dockerfile: services/compliance-intelligence/Dockerfile
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      COMPLIANCE_PORT: "8085"
      MOCK_MODE: "true"
      SINGLE_TENANT_MODE: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      PROVIDERCONFIG_URL: http://providerconfig:8084
      DNC_PROVIDER: mock
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_PINGS: callloom.pings.v1
      KAFKA_TOPIC_COMPLIANCE_RISK_SCORED: callloom.compliance.risk_scored.v1
      KAFKA_TOPIC_COMPLIANCE_VIOLATION: callloom.compliance.violation_detected.v1
      KAFKA_TOPIC_COMPLIANCE_DLQ: callloom.compliance.dlq.v1
      KAFKA_COMPLIANCE_GROUP: callloom-compliance
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-callloom_dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
      providerconfig:
        condition: service_started

  ask-ai:
    profiles: ["intelligence"]
    build:
      context: ..
      dockerfile: services/ask-ai/Dockerfile
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      ASK_AI_PORT: "8086"
      MOCK_MODE: "true"
      DATABASE_URL: postgres://callloom_api:${POSTGRES_API_PASSWORD:-api_dev}@postgres:5432/callloom?sslmode=disable
      PROVIDERCONFIG_URL: http://providerconfig:8084
      LLM_PROVIDER: mock
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-callloom_dev}
      ASK_AI_TOKEN_BUDGET_DAILY: "100000"
      ASK_AI_QUERY_TIMEOUT_SEC: "10"
      ASK_AI_MAX_ROWS: "100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
      providerconfig:
        condition: service_started

  ad-attribution:
    profiles: ["intelligence"]
    build:
      context: ..
      dockerfile: services/ad-attribution/Dockerfile
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      ATTRIBUTION_PORT: "8087"
      MOCK_MODE: "true"
      ATTRIBUTION_MOCK_BRIDGE: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      PROVIDERCONFIG_URL: http://providerconfig:8084
      ATTRIBUTION_PROVIDER: mock
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_PINGS: callloom.pings.v1
      KAFKA_TOPIC_CONVERSIONS: callloom.conversions.v1
      KAFKA_TOPIC_ATTRIBUTION_ATTRIBUTED: callloom.attribution.attributed.v1
      KAFKA_TOPIC_ATTRIBUTION_DLQ: callloom.attribution.dlq.v1
      KAFKA_ATTRIBUTION_GROUP: callloom-attribution
      KAFKA_ATTRIBUTION_BRIDGE_GROUP: callloom-attribution-bridge
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-callloom_dev}
      ATTRIBUTION_DEDUP_TTL_HOURS: "24"
      ATTRIBUTION_FIRE_MAX_RETRIES: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
      providerconfig:
        condition: service_started

  platform-sync:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/platform-sync/Dockerfile
    ports:
      - "127.0.0.1:8088:8088"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      APP_ENV: ${APP_ENV:-development}
      PLATFORM_SYNC_PORT: "8088"
      DATABASE_URL: postgres://callloom_sync:${POSTGRES_SYNC_PASSWORD:-sync_dev}@postgres:5432/callloom?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_PINGS: callloom.pings.v1
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ANI_ENCRYPTION_KEY: ${ANI_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      MOCK_MODE: ${MOCK_MODE:-true}
      DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED:-true}
      MOCK_DEDUP_PROOF: "0"
      WRITEBACK_ENABLED: ${WRITEBACK_ENABLED:-false}
      WRITEBACK_SETTLE_SECONDS: "20"
      WRITEBACK_SETTLE_SECONDS_RETREAVER: ${WRITEBACK_SETTLE_SECONDS_RETREAVER:-20}
      WRITEBACK_INTERNAL_TOKEN: ${WRITEBACK_INTERNAL_TOKEN:-dev_writeback_internal_token_change_me}
      SYNC_INTERVAL_SEC: "120"
      DEDUP_TTL_HOURS: "240"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  scoring:
    profiles: ["intelligence"]
    build:
      context: ../services/scoring
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SCORING_PORT: "8082"
      MOCK_MODE: "true"
      MOCK_EMITTER_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_PINGS: callloom.pings.v1
      KAFKA_TOPIC_CALL_TRANSCRIPT_READY: callloom.calls.call_transcript_ready.v1
      KAFKA_TOPIC_CALL_SCORED: callloom.calls.call_scored.v1
      KAFKA_TOPIC_SCORING_DLQ: callloom.scoring.dlq.v1
      KAFKA_SCORING_GROUP: callloom-scoring
      KAFKA_MOCK_EMITTER_GROUP: callloom-scoring-mock-emitter
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-callloom_dev}
      TRANSCRIPTION_PROVIDER: mock
      AI_PROVIDER: mock
      RECORDING_SOURCE: mock
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully

  enrichment:
    profiles: ["intelligence"]
    build:
      context: ../services/enrichment
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      ENRICHMENT_PORT: "8083"
      MOCK_MODE: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_PINGS: callloom.pings.v1
      KAFKA_TOPIC_ENRICHMENT_DLQ: callloom.enrichment.dlq.v1
      KAFKA_ENRICHMENT_GROUP: callloom-enrichment
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-callloom_dev}
      ENRICHMENT_PROVIDER: mock
      ENRICHMENT_CACHE_TTL_HOURS: "24"
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully

  web:
    restart: unless-stopped
    build:
      context: ../web
      args:
        # Baked into the browser bundle. Required so login cannot fall back to localhost.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL in .env}
        NEXT_PUBLIC_MOCK_MODE: ${NEXT_PUBLIC_MOCK_MODE:-true}
        NEXT_PUBLIC_RETREAVER_CALL_URL_PATTERN: ${NEXT_PUBLIC_RETREAVER_CALL_URL_PATTERN:-https://retreaver.com/calls/{id}}
        NEXT_PUBLIC_FEATURE_ASK_AI: ${NEXT_PUBLIC_FEATURE_ASK_AI:-false}
    ports:
      # Host 3101 — avoid reserved 3000–3003 on shared servers.
      - "127.0.0.1:3101:3000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL in .env}
      NEXT_PUBLIC_MOCK_MODE: ${NEXT_PUBLIC_MOCK_MODE:-true}
      NEXT_PUBLIC_RETREAVER_CALL_URL_PATTERN: ${NEXT_PUBLIC_RETREAVER_CALL_URL_PATTERN:-https://retreaver.com/calls/{id}}
    depends_on:
      - api

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
