services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callloom
      POSTGRES_PASSWORD: callloom_dev
      POSTGRES_DB: callloom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callloom"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ../db/postgres/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://callloom:callloom_dev@postgres:5432/callloom?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: redpandadata/redpanda:v24.2.4
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk topic create callloom.pings.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.calls.call_recording_ready.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.calls.call_transcript_ready.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.calls.call_scored.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.scoring.dlq.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create callloom.enrichment.dlq.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true
    depends_on:
      redpanda:
        condition: service_healthy

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    volumes:
      - ../db/clickhouse/migrations/000002_phase2_analytics.up.sql:/init.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until clickhouse-client --host clickhouse --password callloom_dev --query "SELECT 1"; do sleep 2; done
        clickhouse-client --host clickhouse --password callloom_dev --multiquery < /init.sql || true
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: callloom_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../db/clickhouse/migrations/000001_pings_table.up.sql:/docker-entrypoint-initdb.d/001_pings.sql:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion:
    build:
      context: ../services/ingestion
    ports:
      - "8080:8080"
    environment:
      INGESTION_PORT: "8080"
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_PINGS: callloom.pings.v1
      DATABASE_URL: postgres://callloom_ingestion:ingestion_dev@postgres:5432/callloom?sslmode=disable
      ANI_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  consumer:
    build:
      context: ../services/consumer
    ports:
      - "8081:8081"
    environment:
      CONSUMER_PORT: "8081"
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_PINGS: callloom.pings.v1
      KAFKA_CONSUMER_GROUP: callloom-consumer
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: callloom_dev
      BATCH_SIZE: "500"
      BATCH_FLUSH_MS: "5000"
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  api:
    build:
      context: ../services/api
    ports:
      - "3000:3000"
    environment:
      API_PORT: "3000"
      DATABASE_URL: postgres://callloom_api:api_dev@postgres:5432/callloom?sslmode=disable
      JWT_SECRET: callloom_dev_jwt_secret_min_32_chars_long
      CLICKHOUSE_URL: http://default:callloom_dev@clickhouse:8123
      CLICKHOUSE_DB: default
      MOCK_MODE: "true"
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_CALL_TRANSCRIPT_READY: callloom.calls.call_transcript_ready.v1
      DEEPGRAM_CALLBACK_SECRET: dev_deepgram_callback_secret_change_me
      ADSPEND_SOURCE: mock
      NOTIFICATION_CHANNEL: mock
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  scoring:
    build:
      context: ../services/scoring
    ports:
      - "8082:8082"
    environment:
      SCORING_PORT: "8082"
      MOCK_MODE: "true"
      MOCK_EMITTER_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_PINGS: callloom.pings.v1
      KAFKA_TOPIC_CALL_TRANSCRIPT_READY: callloom.calls.call_transcript_ready.v1
      KAFKA_TOPIC_CALL_SCORED: callloom.calls.call_scored.v1
      KAFKA_TOPIC_SCORING_DLQ: callloom.scoring.dlq.v1
      KAFKA_SCORING_GROUP: callloom-scoring
      KAFKA_MOCK_EMITTER_GROUP: callloom-scoring-mock-emitter
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: callloom_dev
      TRANSCRIPTION_PROVIDER: mock
      AI_PROVIDER: mock
      RECORDING_SOURCE: mock
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully

  enrichment:
    build:
      context: ../services/enrichment
    ports:
      - "8083:8083"
    environment:
      ENRICHMENT_PORT: "8083"
      MOCK_MODE: "true"
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_PINGS: callloom.pings.v1
      KAFKA_TOPIC_ENRICHMENT_DLQ: callloom.enrichment.dlq.v1
      KAFKA_ENRICHMENT_GROUP: callloom-enrichment
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: callloom_dev
      ENRICHMENT_PROVIDER: mock
      ENRICHMENT_CACHE_TTL_HOURS: "24"
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - api

volumes:
  postgres_data:
  clickhouse_data:
