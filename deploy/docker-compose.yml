services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callloom
      POSTGRES_PASSWORD: callloom_dev
      POSTGRES_DB: callloom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  ingestion:
    build:
      context: ../services/ingestion
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: redpanda:9092
    depends_on:
      - redis
      - redpanda

  consumer:
    build:
      context: ../services/consumer
    ports:
      - "8081:8081"
    environment:
      KAFKA_BROKER: redpanda:9092
      CLICKHOUSE_DSN: clickhouse://clickhouse:9000/default
    depends_on:
      - redpanda
      - clickhouse

  api:
    build:
      context: ../services/api
    ports:
      - "3000:3000"
    environment:
      API_PORT: "3000"
      DATABASE_URL: postgres://callloom:callloom_dev@postgres:5432/callloom
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ../web
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - api

volumes:
  postgres_data:
  clickhouse_data:
