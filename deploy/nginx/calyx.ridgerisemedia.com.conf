# calyx.ridgerisemedia.com
# Web UI  → 127.0.0.1:3101   (compose host port for the Next.js container)
# API/WS  → 127.0.0.1:3100   (compose host port for the NestJS container)
#
# /pings is both the Ping Feed page and the API list, so HTML goes to Next
# and other requests go to the API. script-src includes 'unsafe-inline'
# because this file hides the app's per-request nonce CSP.

map "$http_rsc|$http_accept" $calyx_pings_upstream {
    default                   http://127.0.0.1:3100;
    "~*^1\|"                  http://127.0.0.1:3101;
    "~*text/html"             http://127.0.0.1:3101;
    "~*text/x-component"      http://127.0.0.1:3101;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name calyx.ridgerisemedia.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name calyx.ridgerisemedia.com;

    ssl_certificate     /etc/letsencrypt/live/calyx.ridgerisemedia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calyx.ridgerisemedia.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/calyx.ridgerisemedia.com/chain.pem;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; block-all-mixed-content" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;
    add_header Expect-CT "max-age=86400, enforce" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    proxy_hide_header X-Powered-By;
    fastcgi_hide_header X-Powered-By;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Next redirect() builds an absolute Location from the container address.
    # Turn those into a path so the browser stays on this host and scheme.
    proxy_redirect http://127.0.0.1:3101/ /;
    proxy_redirect http://localhost:3101/ /;
    proxy_redirect http://127.0.0.1:3000/ /;
    proxy_redirect http://localhost:3000/ /;
    proxy_redirect http://calyx.ridgerisemedia.com/ /;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    # Pages, including /coverage and Next.js redirects, use location / below.
    # These exact paths are API routes only.
    location = /pings {
        proxy_pass $calyx_pings_upstream;
    }

    location = /pings/export {
        proxy_pass http://127.0.0.1:3100;
    }

    location = /ask {
        error_page 418 = @calyx_api;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 418;
        }
        proxy_pass http://127.0.0.1:3101;
    }

    location = /ask/history {
        proxy_pass http://127.0.0.1:3100;
    }

    location = /scoring/scores {
        proxy_pass http://127.0.0.1:3100;
    }

    location = /scoring/transcript {
        proxy_pass http://127.0.0.1:3100;
    }

    location = /scoring/deepgram/callback {
        proxy_pass http://127.0.0.1:3100;
    }

    location = /compliance/risk-scores {
        proxy_pass http://127.0.0.1:3100;
    }

    location = /compliance/violations {
        proxy_pass http://127.0.0.1:3100;
    }

    location = /compliance/exposure {
        proxy_pass http://127.0.0.1:3100;
    }

    location = /coverage/heatmap {
        proxy_pass http://127.0.0.1:3100;
    }

    location = /attribution/events {
        proxy_pass http://127.0.0.1:3100;
    }

    location = /attribution/status {
        proxy_pass http://127.0.0.1:3100;
    }

    location /socket.io/ {
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:3100;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:3100;
    }

    location /analytics/ {
        proxy_pass http://127.0.0.1:3100;
    }

    location /integrations {
        proxy_pass http://127.0.0.1:3100;
    }

    location /alerts/ {
        proxy_pass http://127.0.0.1:3100;
    }

    location /providers/ {
        proxy_pass http://127.0.0.1:3100;
    }

    location /enrichment/ {
        proxy_pass http://127.0.0.1:3100;
    }

    location /scorecards {
        proxy_pass http://127.0.0.1:3100;
    }

    location /native/ {
        proxy_pass http://127.0.0.1:3100;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3100;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:3100;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
    }

    location @calyx_api {
        proxy_pass http://127.0.0.1:3100;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
