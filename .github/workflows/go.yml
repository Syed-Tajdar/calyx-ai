# Builds, vets and tests every Go module in the repo.
#
# v1 sync health (Part 1, item 8): the old template ran `go build ./...` at the repo root,
# which has no go.mod (each service is its own module), with Go 1.20 while every go.mod needs
# 1.25 — so it failed on every main push since 2026-06-12. Now each module runs on its own,
# with the Go version from its own go.mod.

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/pingdedup
          - services/ad-attribution
          - services/ask-ai
          - services/compliance-intelligence
          - services/consumer
          - services/enrichment
          - services/ingestion
          - services/platform-sync
          - services/providerconfig
          - services/scoring
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ matrix.module }}/go.mod
        cache-dependency-path: ${{ matrix.module }}/go.sum

    - name: Build
      run: go build ./...

    # cmd/probe-* are one-off investigation tools, not services. Three old platform-sync probes
    # still discard a context cancel func on main; the fix (b1f6310) lands with 2D, after which
    # this exclusion can go.
    - name: Vet
      run: go vet $(go list ./... | grep -v '/cmd/probe-')

    # Database-backed tests skip themselves when DATABASE_URL is not set.
    - name: Test
      run: go test ./...
